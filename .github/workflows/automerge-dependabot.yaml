name: Automerge Dependabot PRs

on:
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@3f1088eb3eadd16f4486866844e3cb2bc08b88c2 # ratchet:navikt/automerge-dependabot@main
        with:
          token: ${{ github.token }}
          minimum-age-of-pr: '0'
          merge-method: 'squash'
          always-allow: no.nav.familie.kontrakter,no.nav.familie.felles
          auto-approve: 'true'
