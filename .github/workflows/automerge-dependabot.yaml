name: Automerge Dependabot PRs

on:
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@09f5db3dd1413c6de20825c6b6c3e1cb682c92de # ratchet:navikt/automerge-dependabot@main
        with:
          token: ${{ github.token }}
          minimum-age-of-pr: '0'
          merge-method: 'squash'
          always-allow: no.nav.familie.kontrakter,no.nav.familie.felles
          auto-approve: 'true'
