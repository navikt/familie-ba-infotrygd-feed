name: Automerge Dependabot PRs

on:
  workflow_dispatch:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Automerge Dependabot PRs
        uses: navikt/automerge-dependabot@7d7819cc8497828657b3c2cdd230f7c13fe7a5ea # ratchet:navikt/automerge-dependabot@main
        with:
          token: ${{ github.token }}
          minimum-age-of-pr: '0'
          merge-method: 'squash'
          always-allow: no.nav.familie.kontrakter,no.nav.familie.felles
          auto-approve: 'true'
